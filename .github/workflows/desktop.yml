name: Desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/desktop
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run check:deps
      - run: npm audit signatures
      - run: npm run setup:electron
      - run: npm run check
      - run: python3 -m unittest discover -s runtime/tests -v
      - name: Electron fixture interaction test
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Electron fixture interaction test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      # The race's files-only confinement needs POSIX dir_fd/O_NOFOLLOW; Windows fails closed by design.
      - name: Electron model-race fixture test
        if: runner.os == 'macOS'
        run: npm run test:e2e:race
      - name: Electron model-race fixture test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e:race
      - name: Electron update-reminder fixture test (local feed, no network)
        if: runner.os == 'macOS'
        run: npm run test:e2e:update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: apps/desktop/artifacts/*.png
# Lives at the repository root because GitHub ignores nested workflow files; scoped to
# apps/desktop through defaults.run.working-directory.
# This validates the desktop host and fixture; it is not live-core parity or a signed release.
# Enable push/PR triggers only after the Action commit SHAs are independently verified.
