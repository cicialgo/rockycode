name: Release

# One job: build sdist+wheel on ubuntu, publish to PyPI via Trusted Publishing.
# The old macos-13 matrix (built a cbor2 x86_64-mac wheel for the release page)
# is gone: the runner label was retired, so it never actually ran — 0.1.0 and
# 0.1.1 both sat in its queue until cancelled and shipped fine without it — and
# cbor2 still publishes no x86_64-mac wheel to attach anyway (arm64 only; an
# Intel-Mac install builds it from source via Rust, PyPI-side, as it always
# has). GitHub releases are created by hand: gh release create --notes-file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # OIDC — this is what Trusted Publishing uses
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Build rockycode (sdist + wheel — only our project lands in dist/)
        run: uv build
      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
