name: Release

# PRs and manual runs are rehearsals. Only an approved public-repo tag can
# publish; the private development repository never receives publishing OIDC.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      hashes: ${{ steps.verify.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.10"
          checksum: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"
          python-version: "3.12.14"
          enable-cache: false
      - name: Install locked test dependencies (do not build the project)
        run: uv sync --locked --no-install-project --no-build
      - name: Validate release tag and main ancestry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python scripts/release_check.py --tag "$RELEASE_TAG" --check-only
          git merge-base --is-ancestor HEAD origin/main
      - name: Reproduce distributions and test the installed wheel
        id: verify
        run: uv run --no-sync python scripts/release_check.py
      - name: Source quality and release policy regressions
        env:
          PYTHONPATH: .
        run: |
          uv pip install --python .venv/bin/python --no-deps --offline dist/*.whl
          uv run --no-sync ruff check .
          uv run --no-sync python tests/run_all.py
      - name: Upload only the verified distributions
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence separately (never sent to PyPI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: build/release-evidence.json
          if-no-files-found: error
          retention-days: 30

  pypi:
    needs: build
    if: >-
      github.repository == 'cicialgo/rockycode' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rockycode
    permissions:
      id-token: write
    steps:
      # Same run, immutable artifact ID; no checkout, dependency install or build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Fail closed if downloaded bytes differ from the build
        env:
          EXPECTED_HASHES: ${{ needs.build.outputs.hashes }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(os.environ['EXPECTED_HASHES'])
          files = list(Path('dist').iterdir())
          assert len(files) == 2 and all(p.is_file() and not p.is_symlink() for p in files)
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          assert actual == expected, 'distribution hashes differ from verified build'
          PY
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
          verify-metadata: true
