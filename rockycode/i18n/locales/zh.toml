# 简体中文 — 键与 en.toml 一一对应。
#
# One file per language. Keys are `section.name`; {placeholders} are filled by the
# program and must appear in every language exactly as in en.toml. Colour placeholders
# {violet} {purple} {lavender} {blue} {amber} {red} {muted} come from rockycode/palette.py —
# never write a hex colour here. Rich markup ([dim], [bold], [/]) is part of the copy;
# keep it where the English has it.

# ---- config: feedback from `rockycode config` / `/config` ----
[config]
project_override = '项目配置 {path} 覆盖了此设置：实际生效的 {setting} = {value!r}。'
restart = '请重启 rockycode 以应用此语言设置。'
unknown_key = "未知设置 '{setting}'。可用设置：{known}"
positive_integer = '{setting} 必须为正整数（当前值为 {value!r}）'
positive = '{setting} 必须为正数（当前值为 {value}）'
invalid_value = '{setting} 的值无效：{value!r}。可用值：{allowed}'

# ---- app: the TUI shell: status, hints, loops, plan, artifacts, models, evolve ----
