# rockycode model registry — models are DATA, the engine is generic.
#
# Every provider here speaks the OpenAI chat-completions protocol; the OpenAI
# SDK is the only compatibility layer. A provider is a base URL, a key name, and
# a reasoning WIRE SHAPE; a model is its limits, capabilities, price and roles.
# The engine reads a ModelSpec — it carries no model-specific numbers of its own.
#
# Override or extend WITHOUT touching the install: ~/.rockycode/models.toml has
# this same shape and is deep-merged on top (add a model, correct a limit, add a
# price, `hidden = true` to drop a builtin row). ~/.rockycode/providers.toml
# (custom OpenAI-compatible servers) and ~/.rockycode/endpoints.toml (own base
# URLs, the picker's "custom base URL" row) keep working unchanged.
#
# base_url is the provider's China endpoint only — rocky no longer ships an
# en/cn split. An international or proxy URL is one line in endpoints.toml.
# Verified 2026-09-29 against each provider's own docs unless a `note` says
# otherwise; correcting a value is a one-line data edit here or in the override.
#
# provider fields
#   base_url      the official cn endpoint (OpenAI-compatible, ends in /v1 or /v4)
#   key_env       rocky-OWNED env var for the key (default ROCKYCODE_<NAME>_API_KEY);
#                 key_aliases = older names still read, so nobody's setup breaks
#   reasoning     wire shape: thinking | effort | enable_thinking | minimax | openai | none
#   efforts       the provider's own tiers, low→high (omit = the shape's default;
#                 [] = send no effort field). rocky's dial off|low|high|max is
#                 clamped onto this list at the wire.
#   thinking_off  false = the model cannot switch thinking off (dial `off` sends
#                 the lowest tier instead)
#   cache_field   where usage reports prompt-cache hits:
#                 prompt_cache_hit_tokens (DeepSeek) | cached_tokens (OpenAI-style
#                 prompt_tokens_details)
#   search        a provider-side web search backend, if any (deepseek: the
#                 /anthropic sibling endpoint's server-side web_search tool)
#   peak          name of a [peak.<name>] surcharge schedule that applies to
#                 this provider's models
#   plan          a subscription-plan endpoint (own URL, own key) — pickable as
#                 <name>-plan with ROCKYCODE_<NAME>_PLAN_API_KEY
#   aliases       old model ids → current id (legacy names keep resolving)
# model fields
#   context / max_output   tokens; compaction and the output clamp pace to these
#   vision        takes image input
#   price.usd / price.cny  per 1M tokens: in_hit · in_miss · out (each currency
#                 from the provider's OWN table, never a conversion). Omitted =
#                 the footer says "prices unset" — honest, never a guess.
#   roles         default = the pick for a bare `/model <provider>` (first model
#                 wins too) · sidecar = the cheap model for titles / image
#                 describe / search on the home key · search = the model the
#                 native web_search backend calls
#   hidden        true = drop this row (an override hiding a builtin)

schema = 1

# ── DeepSeek — rocky's home provider (rides ROCKYCODE_API_KEY) ───────────────
[providers.deepseek]
label = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
key_env = "ROCKYCODE_API_KEY"
reasoning = "thinking"
efforts = ["low", "high", "max"]
thinking_off = true
cache_field = "prompt_cache_hit_tokens"
search = "anthropic"
peak = "deepseek"

[providers.deepseek.aliases]
# retired 2026-09-10: DeepSeek still accepts the names and serves them with
# V4.1-Flash at Flash rates — rocky maps them so old configs keep working.
"deepseek-v4-flash" = "deepseek-flash"
"deepseek-v4-flash-vision-exp" = "deepseek-flash"

[models."deepseek-flash"]
provider = "deepseek"
label = "V4.1 Flash — rocky's home model"
context = 1048576
max_output = 384000
vision = true
roles = ["default", "sidecar", "search"]
note = "DeepSeek-V4.1-Flash (2026-09-10): native image input, thinking optional (on by default)"
[models."deepseek-flash".price]
usd = { in_hit = 0.003, in_miss = 0.15, out = 0.60 }
cny = { in_hit = 0.02, in_miss = 1.0, out = 4.0 }

[models."deepseek-v4-pro"]
provider = "deepseek"
label = "V4 Pro — text only · routes to V4.1-Flash at Flash rates until V4.1-Pro ships"
context = 1048576
max_output = 384000
vision = false
note = "since 2026-09-14 every request is served by V4.1-Flash and billed at Flash rates; the listed price is the standing Pro table"
[models."deepseek-v4-pro".price]
usd = { in_hit = 0.022, in_miss = 0.66, out = 1.98 }
cny = { in_hit = 0.15, in_miss = 4.5, out = 13.5 }

