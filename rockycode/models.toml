# ── peak-hour surcharge schedules ────────────────────────────────────────────
[peak.deepseek]
# DeepSeek peak-valley pricing: peak = 2x base during Beijing 9:00–12:00 and
# 14:00–18:00 (UTC 01:00–04:00, 06:00–10:00), Monday–Friday, excluding Chinese
# public holidays (weekends + holidays bill off-peak). Verified 2026-09-29.
enabled = true
multiplier = 2.0
effective_date = "2026-07-15"
windows_utc = [{ start = "01:00", end = "04:00" }, { start = "06:00", end = "10:00" }]
weekdays_only = true
holidays = []   # ISO dates (Beijing) — maintain in ~/.rockycode/models.toml or pricing.toml
