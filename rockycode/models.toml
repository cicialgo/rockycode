# ── OpenRouter — free models, international (no cn host) ─────────────────────
# OpenAI-compatible chat completions at https://openrouter.ai/api/v1.
# Not the home provider: no `default` / `sidecar` / `search` role, so DeepSeek
# stays the launch model. The picker lists these rows only when
# ROCKYCODE_OPENROUTER_API_KEY is set (https://openrouter.ai/keys, then
# ~/.rockycode/.env). The verifier's OPENROUTER_API_KEY is a different
# variable and is not read here.
# Free-tier limits (OpenRouter docs, rechecked 2026-10-23): 20 requests/minute
# and 50/day until the account has bought at least $10 of credits; 1,000/day
# after that (the per-minute cap stays 20). Failed attempts count toward the
# daily cap. Price is omitted — these rows are $0, and the footer stays
# "prices unset".
# reasoning = none: the free catalog does not share one reasoning wire shape,
# and OpenRouter's `reasoning` object is not one of rocky's shapes. Sending
# nothing keeps a non-reasoning model from rejecting the request. No switches
# (the generic OpenAI history path). Cache hits, when a
# provider reports them, are OpenAI-style prompt_tokens_details.cached_tokens.
# Optional HTTP-Referer / X-OpenRouter-Title headers are not sent.
# Groq and Gemini's OpenAI-compatible free tiers are not builtin rows — point
# ~/.rockycode/providers.toml (or endpoints.toml) at them.
[providers.openrouter]
label = "OpenRouter (free)"
base_url = "https://openrouter.ai/api/v1"
key_env = "ROCKYCODE_OPENROUTER_API_KEY"
reasoning = "none"
cache_field = "cached_tokens"

[providers.openrouter.aliases]
# The docs' wire id keeps resolving if someone pastes it into /model.
"openrouter/free" = "openrouter-free"

[models."openrouter-free"]
provider = "openrouter"
label = "Free Models Router — a free model that supports this request"
context = 65536
max_output = 8192
vision = true
wire = "openrouter/free"
note = "wire id openrouter/free (checked 2026-10-23). The router filters for tools, images and structured outputs, then picks a free model at random — including very small ones, so tool quality varies. OpenRouter publishes context_length 200000 for the router, but that is a ceiling: the serving model's window is what the request gets. The smallest tool-capable :free model that day (liquid/lfm-2.5-2.6b:free) is 65536 context / 8192 output, so rocky paces to that floor. Raise both in ~/.rockycode/models.toml to use the published ceiling. Same free-tier rate limits as the provider comment. Some free providers log prompts; do not send secrets. The :free catalog changes often."

# ── peak-hour surcharge schedules ────────────────────────────────────────────
[peak.deepseek]
# DeepSeek peak-valley pricing: peak = 2x base during Beijing 9:00–12:00 and
# 14:00–18:00 (UTC 01:00–04:00, 06:00–10:00), Monday–Friday, excluding Chinese
# public holidays (weekends + holidays bill off-peak). Verified 2026-09-29.
enabled = true
multiplier = 2.0
effective_date = "2026-07-15"
windows_utc = [{ start = "01:00", end = "04:00" }, { start = "06:00", end = "10:00" }]
weekdays_only = true
holidays = []   # ISO dates (Beijing) — maintain in ~/.rockycode/models.toml or pricing.toml
