# Data-analysis capability pack — provisioned on demand for the desktop app so
# the agent's local code execution can crunch CSV/Excel/dataframes. pandas pulls
# numpy; neither requires pyarrow.
#   uv pip install 'rockycode[data-analysis]'
data-analysis = [
    "pandas==3.0.2",
    "numpy==2.4.4",
    # ── sub-packages, pinned to uv.lock by scripts/lock_closure.py (do not edit by hand) ──
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "tzdata==2026.2 ; sys_platform == 'emscripten' or sys_platform == 'win32'",
    # ── end of the pinned sub-packages ──
]

# PDF reading/extraction pack. Commercial-friendly licenses only:
# pypdf (BSD) for text, pdfplumber (MIT) for tables/layout. Deliberately NOT
# PyMuPDF/fitz, which is AGPL/commercial.
#   uv pip install 'rockycode[pdf]'
pdf = [
    "pypdf==6.21.4",
    "pdfplumber==0.11.10",
    # ── sub-packages, pinned to uv.lock by scripts/lock_closure.py (do not edit by hand) ──
    "charset-normalizer==3.4.7",
    "pdfminer-six==20260107",
    "pillow==12.3.0",
    "pypdfium2==5.11.0",
    # ── end of the pinned sub-packages ──
]

# Keep keys in the OS keychain instead of the ~/.rockycode/.env file — encrypted
# at rest. Installed by default on macOS and Windows (see dependencies); this
# extra is for a Linux desktop with a Secret Service. Offered first when present.
#   uv pip install 'rockycode[keyring]'
keyring = [
    "keyring==25.7.0",
    # ── sub-packages, pinned to uv.lock by scripts/lock_closure.py (do not edit by hand) ──
    "backports-tarfile==1.2.0 ; python_full_version < '3.12'",
    "importlib-metadata==9.0.0 ; python_full_version < '3.12'",
    "jaraco-classes==3.4.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.5.0",
    "jeepney==0.9.0 ; sys_platform == 'linux'",
    "more-itertools==11.1.0",
    "secretstorage==3.5.0 ; sys_platform == 'linux'",
    "zipp==4.1.0 ; python_full_version < '3.12'",
    # ── end of the pinned sub-packages ──
]

[dependency-groups]
# Development-only quality gate. Pin it so contributors and CI enforce the
# exact same rules; Ruff is not shipped in the rockycode runtime wheel.
dev = [
    "ruff==0.16.1",
    "PyYAML==6.0.3",  # parse workflow policy in the offline release regressions
]

[project.scripts]
rockycode = "rockycode.cli:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
reproducible = true

# A private checkout must never leak dev docs, apps, credentials or experiments
# through Hatch's default sdist selection. The wheel contains the same core.
[tool.hatch.build.targets.sdist]
only-include = ["rockycode", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]
# Release builds additionally stage only these paths (Hatch otherwise forcibly
# includes .gitignore even with ignore-vcs). Ignore local VCS selection rules.
ignore-vcs = true
exclude = ["**/__pycache__", "**/*.pyc", "**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["rockycode"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Conservative correctness baseline: import/syntax errors, undefined names,
# unused imports/variables, and a small set of unambiguous PEP 8 errors.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Smoke tests are executable scripts: many intentionally set cwd/env before
# importing rockycode, and some use compact procedural assertions. Keep F/E9
# correctness checks active without forcing a wholesale test rewrite.
"tests/*.py" = ["E402", "E702", "E741"]
# Desktop host (apps/desktop): compact one-statement-per-line style is its own
# convention; correctness checks (F, E4, E9) stay active. Its scripts and tests
# set sys.path before importing the core, like the smoke tests above.
"apps/desktop/**/*.py" = ["E701", "E702"]
"apps/desktop/scripts/*.py" = ["E402"]
"apps/desktop/runtime/tests/*.py" = ["E402"]
