[project.optional-dependencies]
# Evaluation / SWE-bench harness. This is the source of the old ~260 MB bloat:
# `datasets` pulls pyarrow (125M) + pandas + numpy; `swebench` pulls docker etc.
# Only needed to score against SWE-bench, never to run the agent.
#   uv pip install 'rockycode[bench]'
bench = [
    "swebench==4.1.0",
    "datasets==4.8.5",
    "docker==7.1.0",
    # Security floor (filelock 4.2.7, virtualenv 21.15.1) plus compatible virtualenv resolver chain; keep bench-only.
    "filelock==4.2.7",
    "virtualenv==21.15.1",
    "python-discovery==1.6.1",
    # ── sub-packages, pinned to uv.lock by scripts/lock_closure.py (do not edit by hand) ──
    "cbor2==6.0.1",
    "cfgv==3.5.0",
    "chardet==7.4.3",
    "charset-normalizer==3.4.7",
    "dill==0.4.1",
