[project]
name = "rockycode"
version = "1.0.0"
description = "A coding agent harness, benchmarked on SWE-bench Verified. amaze!"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rockycode contributors" }]
# Exact pins (==) for an explicit, audit-friendly spec. The lock already pins
# these + transitives with hashes; this makes pyproject itself unambiguous.
# Bump a version here, then `uv lock`, to update. (requires-python stays a
# range — it's the supported interpreter span, not a dependency.)
#
# Core runtime — everything needed to RUN the agent (interactive CLI/TUI).
# Command execution is local (asyncio subprocess), so no docker/datasets here.
# Heavy optional capabilities live in the extras below and are installed on
# demand. Keep this list lean: it is what every install (and the desktop app
# sidecar) ships by default.
dependencies = [
    "openai==2.36.0",
    "rich==15.0.0",
    "typer==0.25.1",
    "python-dotenv==1.2.2",
    "textual==8.2.7",
    "mcp==1.27.2",
    "sqlite-vec==0.1.9",
    "httpx==0.28.1",
    "certifi==2026.10.19",  # GHSA-6q48-6c7w-9gw2: keep wheel installs patched too
    "beautifulsoup4==4.14.3",
    "aiohttp==3.14.5",  # GHSA-5wr8-gcqf-gqf3: initial request timeout
    # Tiny (~230 KB, pure-Python, no config, no transitive deps) always-available
    # fallback for the check_code tool when no ruff is installed — catches real
    # bugs (undefined names, unused imports), not style noise.
    "pyflakes==3.2.0",
    # The OS keychain where the system always has one (macOS Keychain, Windows
    # Credential Manager): a key kept there is not a file a command can read.
    # ~670 KB with its pure-Python dependencies. Linux needs a desktop Secret
    # Service (and pulls `cryptography`), so there it stays the opt-in extra below.
    "keyring==25.7.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    # ── sub-packages, pinned to uv.lock by scripts/lock_closure.py (do not edit by hand) ──
    "aiohappyeyeballs==2.6.1",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "backports-tarfile==1.2.0 ; (python_full_version < '3.12' and sys_platform == 'darwin') or (python_full_version < '3.12' and sys_platform == 'win32')",
    "cffi==2.1.1 ; platform_python_implementation != 'PyPy'",
    "click==8.3.3",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "cryptography==48.0.1",
    "distro==1.9.0",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx-sse==0.4.3",
    "idna==3.13",
    "importlib-metadata==9.0.0 ; (python_full_version < '3.12' and sys_platform == 'darwin') or (python_full_version < '3.12' and sys_platform == 'win32')",
    "jaraco-classes==3.4.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "jaraco-context==6.1.2 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "jaraco-functools==4.5.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "jiter==0.18.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "linkify-it-py==2.1.0",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "mdurl==0.1.2",
    "more-itertools==11.1.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "multidict==6.7.1",
    "platformdirs==4.9.6",
    "propcache==0.5.2",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pydantic==2.14.2",
    "pydantic-core==2.50.2",
    "pydantic-settings==2.14.1",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
    "pywin32==312 ; sys_platform == 'win32'",
    "pywin32-ctypes==0.2.3 ; sys_platform == 'win32'",
    "referencing==0.37.0",
    "rpds-py==2026.5.1",
    "shellingham==1.5.4",
    "sniffio==1.3.1",
    "soupsieve==2.8.3",
    "sse-starlette==3.4.4",
    "starlette==1.3.0",
    "tqdm==4.67.3",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uc-micro-py==2.0.0",
