    "grpclib==0.4.9",
    "h2==4.3.0",
    "hf-xet==1.5.0 ; platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'arm64' or platform_machine == 'x86_64'",
    "hpack==4.1.0",
    "huggingface-hub==1.14.0",
